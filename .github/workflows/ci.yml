name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      - name: ReasonedTrace lab test
        run: pytest -q labs/reasoned_trace/tests

      - name: Routing evaluation smoke test
        run: reasoned-evaluate --json > /tmp/reasoned-routing-evaluation.json

      - name: Evaluation validity smoke test
        run: reasoned-validity --n 1200 --seed 23 --json > /tmp/reasoned-validity.json

      - name: Evaluation applicability smoke test
        run: >-
          reasoned-applicability --outcome-type continuous
          --comparison department_outcome --json
          > /tmp/reasoned-applicability.json

      - name: Adaptive routing policy smoke test
        run: reasoned-policy evaluate --synthetic-n 1200 --seed 23 > /tmp/reasoned-policy.json

      - name: Longitudinal benchmark smoke test
        run: >-
          reasoned-longitudinal --entities 100 --days 600 --seed 31 --json
          > /tmp/reasoned-longitudinal.json

      - name: Outcome analysis smoke test
        run: reasoned-analyze --synthetic-n 120 --seed 41 --json > /tmp/reasoned-analysis.json

      - name: Management report smoke test
        run: >-
          reasoned-management-report --synthetic-n 120 --seed 41
          --output /tmp/reasoned-management-report.md
          --json-output /tmp/reasoned-management-report.json

      - name: Portfolio showcase smoke test
        run: >-
          reasoned-showcase --outcome-rows 120 --logged-rows 400
          --longitudinal-entities 80 --longitudinal-days 540
          --output /tmp/reasoned-showcase.md
          --json-output /tmp/reasoned-showcase.json

      - name: Data governance policy check
        run: reasoned-governance-check --json > /tmp/reasoned-data-governance.json

  distribution:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build frontend
        run: python -m pip install --upgrade build

      - name: Build wheel and source distribution
        run: python -m build

      - name: Verify distribution files
        shell: bash
        run: |
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 1
          ls -lh dist/

      - name: Install built wheel in clean virtual environment
        shell: bash
        run: |
          python -m venv /tmp/reasoned-wheel-venv
          /tmp/reasoned-wheel-venv/bin/python -m pip install --upgrade pip
          /tmp/reasoned-wheel-venv/bin/python -m pip install dist/*.whl

      - name: Smoke test installed wheel
        shell: bash
        run: |
          /tmp/reasoned-wheel-venv/bin/python - <<'PY'
          from importlib.metadata import version

          import reasoned_ops
          from reasoned_ops import ServiceCase, baseline_route

          assert reasoned_ops.__version__ == version("reasoned-ops")
          decision = baseline_route(
              ServiceCase(
                  case_id="wheel-smoke",
                  message="The air conditioner is leaking again.",
                  previous_related_cases=2,
              )
          )
          assert decision.department == "maintenance"
          print(reasoned_ops.__version__, decision.department, decision.priority)
          PY
          /tmp/reasoned-wheel-venv/bin/reasoned-applicability --help >/dev/null
